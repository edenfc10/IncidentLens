[project]
name = "incidentlens-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.5,<5.6",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.7,<5",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<3.17",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<0.12",
]
